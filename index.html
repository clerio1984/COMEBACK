
<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f224a">
    <meta name="description" content="ComeBack Moçambique — plataforma para encontrar e devolver objetos, documentos e animais perdidos ou achados.">
    <meta name="format-detection" content="telephone=no">
    <title>ComeBack Moçambique - Radar de Perdidos e Achados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              souto: {
                50: '#f0f7fe',
                100: '#e0effd',
                200: '#bae0fb',
                300: '#7dcbf8',
                400: '#38b0f4',
                azure: '#008fe2',
                500: '#008fe2',
                600: '#0072c3',
                blue: '#1d4ed8',
                royal: '#1e40af',
                700: '#1d4ed8',
                navy: '#153268',
                800: '#153268',
                midnight: '#0f224a',
                900: '#0f224a',
                dark: '#08142b',
                950: '#08142b',
              }
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    .leaflet-popup-content-wrapper {
        border-radius: 1rem;
        padding: 0;
        overflow: hidden;
    }
    .leaflet-popup-content {
        margin: 0 !important;
        width: 200px !important;
    }
    .leaflet-container {
        font-family: inherit;
    }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
    }
    @keyframes pulse-gold-orange {
        0%, 100% {
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3), 0 0 0 0px rgba(245, 158, 11, 0.6);
            border-color: rgba(245, 158, 11, 1);
        }
        50% {
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3), 0 0 0 10px rgba(245, 158, 11, 0);
            border-color: rgba(245, 158, 11, 0.4);
        }
    }
    .pulse-amber-border {
        animation: pulse-gold-orange 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-red-blood {
        0%, 100% {
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3), 0 0 0 0px rgba(239, 68, 68, 0.6);
            border-color: rgba(239, 68, 68, 1);
        }
        50% {
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3), 0 0 0 10px rgba(239, 68, 68, 0);
            border-color: rgba(239, 68, 68, 0.4);
        }
    }
    .pulse-red-border {
        animation: pulse-red-blood 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }
    .marquee-container {
        display: flex;
        overflow: hidden;
        width: 100%;
        position: relative;
    }
    .marquee-content {
        display: flex;
        animation: marquee 30s linear infinite;
        width: max-content;
    }
    .marquee-content:hover {
        animation-play-state: paused;
    }
    
    /* Elegant style for item-card-verified-badge with gradient border and subtle glow */
    .item-card-verified-badge {
        position: relative;
        color: #1d4ed8 !important; /* Rich deep blue */
        border: 2px solid transparent !important;
        
        /* Multiple background layers: inside background + gradient border outer box */
        background-image: linear-gradient(135deg, rgba(239, 246, 255, 0.95) 0%, rgba(245, 243, 255, 0.95) 100%), 
                          linear-gradient(135deg, #3b82f6 0%, #6366f1 50%, #10b981 100%) !important;
        background-origin: border-box !important;
        background-clip: padding-box, border-box !important;
        
        box-shadow: 0 2px 8px -1px rgba(59, 130, 246, 0.15), inset 0 0 1px rgba(255, 255, 255, 0.6) !important;
        padding: 0.2rem 0.65rem !important;
        border-radius: 9999px !important;
        font-weight: 950 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.12em !important; /* Slightly increased letter-spacing for iconic look */
        display: inline-flex !important;
        align-items: center !important;
        gap: 0.35rem !important;
        font-size: 8px !important;
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1) !important;
        overflow: hidden !important;
        animation: badge-pulse 3s infinite ease-in-out !important;
    }
    
    /* Smooth hover effect when parent .item-card is hovered to emphasize reliability */
    .item-card:hover .item-card-verified-badge {
        filter: contrast(1.25) brightness(1.15) drop-shadow(0 0 10px rgba(59, 130, 246, 0.75)) !important;
        transform: scale(1.08) !important;
    }
    
    .dark .item-card:hover .item-card-verified-badge {
        filter: contrast(1.3) brightness(1.2) drop-shadow(0 0 14px rgba(96, 165, 250, 0.9)) !important;
    }
    
    /* Small checkmark icon using ::before of `.item-card-verified-badge` */
    .item-card-verified-badge::before {
        content: "\f058" !important; /* FontAwesome solid circle-check unicode icon */
        font-family: "Font Awesome 6 Free", "Font Awesome 5 Free", "FontAwesome" !important;
        font-weight: 900 !important;
        color: #2563eb !important; /* Dynamic royal blue check icon */
        font-size: 9.5px !important;
        display: inline-block !important;
        font-style: normal !important;
        text-rendering: auto !important;
        -webkit-font-smoothing: antialiased !important;
        animation: icon-pulse-scale 2s infinite ease-in-out !important;
        text-shadow: 0 0 4px rgba(59, 130, 246, 0.4) !important;
    }

    /* Sweep glow active animation */
    .item-card-verified-badge::after {
        content: '';
        position: absolute;
        top: -100%;
        left: -100%;
        width: 60%;
        height: 300%;
        background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.8) 50%, transparent) !important;
        transform: rotate(35deg) !important;
        animation: badge-shine 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite !important;
        pointer-events: none !important;
    }

    /* Dark Mode style override for verified badge */
    .dark .item-card-verified-badge {
        background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 41, 59, 0.95) 100%), 
                          linear-gradient(135deg, #3b82f6 0%, #6366f1 50%, #10b981 100%) !important;
        color: #60a5fa !important;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.15) !important;
    }

    .dark .item-card-verified-badge::before {
        color: #60a5fa !important;
        text-shadow: 0 0 8px rgba(96, 165, 250, 0.6) !important;
    }

    @keyframes badge-pulse {
        0%, 100% {
            transform: scale(1);
            box-shadow: 0 2px 8px -1px rgba(59, 130, 246, 0.15), inset 0 0 1px rgba(255, 255, 255, 0.6) !important;
        }
        50% {
            transform: scale(1.025);
            box-shadow: 0 4px 14px 1px rgba(59, 130, 246, 0.3), inset 0 0 1px rgba(255, 255, 255, 0.8) !important;
        }
    }

    @keyframes icon-pulse-scale {
        0%, 100% {
            transform: scale(1);
            opacity: 0.95;
        }
        50% {
            transform: scale(1.15);
            opacity: 1;
            filter: drop-shadow(0 0 2px rgba(59, 130, 246, 0.7));
        }
    }

    @keyframes badge-shine {
        0% { left: -100%; }
        25% { left: 160%; }
        100% { left: 160%; }
    }

    /* Accessibility: respect reduced-motion preferences. */
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            scroll-behavior: auto !important;
            transition-duration: 0.01ms !important;
        }
    }

    /* Proximity Alert Toast Grid Layout & Responsive Media Query */
    #proximity-alert-toast {
        display: grid;
        grid-template-rows: auto 1fr;
        grid-template-columns: 1fr;
        gap: 0.875rem;
    }

    #proximity-alert-toast.is-minimized {
        display: flex !important;
        align-items: center !important;
        gap: 0.5rem !important;
        padding: 0.5rem 0.85rem !important;
        border-radius: 9999px !important;
        width: auto !important;
        max-width: min(calc(100vw - 1.5rem), 380px) !important;
        cursor: pointer !important;
    }

    #proximity-alert-toast .proximity-toast-header {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 0.5rem;
        width: 100%;
    }

    #proximity-alert-toast .proximity-toast-body {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.875rem;
        align-items: start;
        width: 100%;
    }

    @media (max-width: 480px) {
        #proximity-alert-toast {
            grid-template-columns: 1fr !important;
            max-width: calc(100vw - 1.5rem) !important;
            right: 0.75rem !important;
            bottom: 0.75rem !important;
            padding: 1rem !important;
        }

        #proximity-alert-toast .proximity-toast-header {
            display: grid !important;
            grid-template-columns: 1fr auto !important; /* Distance & countdown kept persistent in header row */
            align-items: center !important;
            gap: 0.35rem !important;
        }

        #proximity-alert-toast .proximity-toast-body {
            grid-template-columns: 1fr !important; /* Single column on extra-small screens */
            gap: 0.65rem !important;
        }

        #proximity-alert-toast .proximity-toast-icon {
            display: none !important;
        }
    }
</style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
